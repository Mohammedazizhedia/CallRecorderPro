name: Extract ZIP
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find newest ZIP
        run: |
          set -e
          ZIP=$(ls -t CallRecorderPro*.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::No ZIP found! Upload one first (Code -> Add file -> Upload files)."
            exit 1
          fi
          echo "Found ZIP: $ZIP"
          unzip -o "$ZIP" -d /tmp/x
          echo "EXTRACTED=$ZIP" >> "$GITHUB_ENV"

      - name: Copy files (excluding .github workflows)
        run: |
          set -e
          if [ -d /tmp/x/CallRecorderPro ]; then
            SRC=/tmp/x/CallRecorderPro
          else
            SRC=/tmp/x
          fi
          rsync -a --exclude='.github' "$SRC"/ ./
          rm -rf /tmp/x "$EXTRACTED_ZIP" 2>/dev/null || true

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Import from $EXTRACTED" || echo "Nothing to commit"
          git push

      - name: Trigger build
        run: |
          gh workflow run build.yml --ref main || echo "::warning::Run 'Build release APK' manually from Actions tab"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
