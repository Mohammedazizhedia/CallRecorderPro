name: Extract ZIP
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and extract newest CallRecorderPro ZIP
        run: |
          set -e
          ZIP=$(ls -t CallRecorderPro*.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::No ZIP found! Upload one first (name must start with CallRecorderPro)."
            ls -la
            exit 1
          fi
          echo "Found ZIP: $ZIP"
          unzip -o "$ZIP" -d /tmp/x
          if [ -d /tmp/x/CallRecorderPro ]; then
            cp -r /tmp/x/CallRecorderPro/. .
          else
            cp -r /tmp/x/. .
          fi
          rm -rf /tmp/x "$ZIP"
          echo "EXTRACTED=$ZIP" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Import from $EXTRACTED" || echo "Nothing to commit"
          git push

      - name: Trigger build (manual fallback if this fails)
        run: |
          gh workflow run build.yml --ref main || echo "::warning::Build not auto-triggered — run 'Build release APK' manually from Actions tab"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
