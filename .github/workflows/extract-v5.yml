name: Extract v5 ZIP
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract newest ZIP
        run: |
          set -e
          ZIP=$(ls -t CallRecorderPro*.zip | head -n 1)
          echo "Extracting: $ZIP"
          unzip -o "$ZIP" -d /tmp/crp
          mv /tmp/crp/CallRecorderPro/* .
          mv /tmp/crp/CallRecorderPro/.[!.]* . 2>/dev/null || true
          rm -rf /tmp/crp "$ZIP"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Extract newest ZIP (v5)" || echo "Nothing to commit"
          git push
