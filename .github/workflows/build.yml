name: Build release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ده بيثبت Gradle 8.9 على الـ runner — بديل الـ wrapper
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore (optional)
        env:
          STORE_FILE_B64: ${{ secrets.RELEASE_STORE_FILE }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$STORE_FILE_B64" ]; then
            echo "$STORE_FILE_B64" | base64 -d > release.keystore
            {
              echo "RELEASE_STORE_FILE=release.keystore"
              echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> gradle.properties
          else
            echo "No signing secrets — debug signature will be used."
          fi

      - name: Build release APK
        run: gradle assembleRelease --stacktrace
      - name: Rename APK with app name and version
        run: |
          set -e
          cd app/build/outputs/apk/release
          APK=$(ls *.apk | head -n 1)
          VER=$(grep 'versionName' ../../../../build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          mv "$APK" "CallRecorderPro-$VER.apk"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: call-recorder-pro-release
          path: app/build/outputs/apk/release/*.apk
